name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  workflow:
    name: predict (mock) · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run wm2026 + math test suites (mock, offline)
        run: |
          pytest -q \
            tests/test_wm2026_pipeline.py \
            tests/test_markets.py \
            tests/test_markets_extended.py \
            tests/test_edge_conservative.py \
            tests/test_backtesting_rps.py \
            tests/test_bivariate_poisson.py \
            tests/test_calibration_offline.py \
            tests/test_overrides.py \
            tests/test_report_html.py \
            tests/test_xg_estimator.py \
            tests/test_tournament.py \
            tests/test_model_tuning.py \
            tests/test_examples_guard.py \
            tests/test_factor_aggregation.py \
            tests/test_phase4_backend.py

      - name: Debug harness — every function on mock data
        run: python debug.py -q

      - name: Smoke — predict a sample fixture (mock, all markets + bankroll)
        run: |
          python -m wm2026.cli predict --mode mock \
            --match config/matches/group_a/cze_vs_rsa.yaml \
            --odds "2.10/3.40/3.20" --odds-ou "1.85/1.95" --odds-btts "1.80/2.00" \
            --odds-dc "1.28/1.30/1.55" --odds-ah=-0.5:1.95/1.95 \
            --bankroll 1000 \
            --out reports/

      - name: Upload prediction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-report-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
