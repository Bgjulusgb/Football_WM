name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  workflow:
    name: predict (mock) · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run wm2026 test suite (mock, offline)
        run: pytest tests/test_wm2026_pipeline.py -q

      - name: Smoke — predict a sample fixture (mock)
        run: |
          python -m wm2026.cli predict \
            --match config/matches/group_a/cze_vs_rsa.yaml \
            --odds "2.10/3.40/3.20" --odds-ou "1.85/1.95" \
            --out reports/

      - name: Upload prediction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-report-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
